<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Islamic Lessons</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#0b6b3a" />
</head>
<body>
  <header>
    <div class="logo">
      <span class="crescent">☪</span>
      <h1>My Islamic Lessons</h1>
    </div>
    <p class="tagline">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>
  </header>

  <main>
    <div class="card">
      <h2>Welcome, Student</h2>
      <p>Please sign in to access your lessons.</p>
      <button id="signInBtn">Sign In</button>
      <p id="message"></p>
    </div>
  </main>

  <script>
    document.getElementById('signInBtn').addEventListener('click', () => {
      document.getElementById('message').textContent =
        'Login coming in the next step!';
    });
  </script>
</body>
</html>
